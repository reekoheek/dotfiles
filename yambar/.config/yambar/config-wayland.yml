small: &small JetBrainsMono Nerd Font:pixelsize=16

# This is THE bar configuration
bar:
  location: top
  height: 20
  spacing: 0
  margin: 0
  font: JetBrainsMono Nerd Font:pixelsize=16
  foreground: ffffffff
  # background: 00000000
  # background: 000000ff
  # background: 66333366
  background: 111111ff

  # border:
  #   width: 0
  #   bottom-width: 1
  #   color: 666666cc
  #   # color: 660000ff
  #   margin: 0

  left:
    - foreign-toplevel:
        content:
          map:
            conditions:
              ~activated: {empty: {}}
              activated:
                - string: {text: " 󰘔 {app-id}: {title}"}


  # center:
  right:
    - pulse:
        content:
          - map:
              on-click: pavucontrol
              default:
                - string: {text: " 󰕾 {sink_percent:03}% "}
              conditions:
                sink_muted:
                  - string: {text: " 󰝟 {sink_percent:03}% ", foreground: ff0000ff}
                sink_percent == 0:
                  - string: {text: " 󰖁 {sink_percent:03}% "}
                sink_percent < 70:
                  - string: {text: " 󰖀 {sink_percent:03}% "}
                sink_percent > 100:
                  - string: {text: " 󰕾 {sink_percent:03}% ", foreground: ffff00ff}
          - string: {text: " | "}

    - backlight:
        name: intel_backlight
        content:
          - string: {text: " 󰃠 {percent:03}% "}
          - string: {text: " | "}

    - network:
        name: en1
        content:
          - map:
              default: {empty: {}}
              conditions:
                name == en1 && carrier:
                  - string: {text: "|"}
                  - map:
                      default: {string: {text: " 󰈀 - ", foreground: ffffff66}}
                      conditions:
                        state == up && ipv4 != "": {string: {text: " 󰈀 {ipv4} "}}
                  - string: {text: " | "}

    - network:
        name: wlo1
        content:
          - map:
              default: {empty: {}}
              conditions:
                name == wlo1:
                  map:
                    on-click: foot nmtui
                    default: {string: {text: " 󰤨 down ", foreground: ffffff66}}
                    conditions:
                      state == down: {string: {text: " 󰤮 down ", foreground: ff0000ff}}
                      state == up:
                        map:
                          default:
                            - string: {text: " 󰤨 {ssid} {ipv4} "}
                          conditions:
                            ipv4 == "":
                              - string: {text: " 󰤨 {ssid} - ", foreground: ffffff66}
          - string: {text: " | "}

    - script:
        path: ~/bin/systower
        args: ["watch"]
        content:
          # CPU
          - map:
              on-click: foot htop
              default:
                - string: {text: " 󰍛 {cpu_percent:05.1f}% "}
              conditions:
                cpu_percent >= 75:
                  - string: {text: " 󰍛 {cpu_percent:05.1f}% ", foreground: ff0000ff}
                cpu_percent >= 50:
                  - string: {text: " 󰍛 {cpu_percent:05.1f}% ", foreground: ffff00ff}
          - string: {text: " | "}
          # Memory
          - map:
              on-click: foot htop
              default:
                - string: {text: " 󰘚 {mem_used:05.1f}GB "}
              conditions:
                mem_percent >= 90:
                  - string: {text: " 󰘚 {mem_used:05.1f}GB ", foreground: ff0000ff}
                mem_percent >= 60:
                  - string: {text: " 󰘚 {mem_used:05.1f}GB ", foreground: ffff00ff}
          - string: {text: " | "}
          # Disk
          - map:
              default:
                - string: {text: " 󰋊 {storage_percent:05.1f}% "}
              conditions:
                storage_percent >= 90:
                  - string: {text: " 󰋊 {storage_percent:05.1f}% ", foreground: ff0000ff}
                storage_percent >= 75:
                  - string: {text: " 󰋊 {storage_percent:05.1f}% ", foreground: ffff00ff}
          - string: {text: " | "}
          # Battery
          - map:
              on-click: gnome-power-statistics
              default:
                - string: {text: " 󰁹 {bat_percent:03}% {bat_estimate} "}
              conditions:
                bat_status == "charging" && bat_percent >= 95:
                  - string: {text: " 󰂄 {bat_percent:03}% {bat_estimate}", foreground: 00ff00ff}
                bat_status == "charging":
                  - string: {text: " 󰂄 {bat_percent:03}% {bat_estimate}"}
                bat_percent <= 15:
                  - string: {text: " 󰂎 {bat_percent:03}% {bat_estimate}", foreground: ff0000ff}
                bat_percent <= 50:
                  - string: {text: " 󰁾 {bat_percent:03}% {bat_estimate}", foreground: ffff00ff}
                bat_status == "full":
                  - string: {text: " 󰁹 {bat_percent:03}%", foreground: 00ff00ff}
          # Caffeine
          - map:
              on-click: ~/bin/systower caffeine toggle
              conditions:
                caffeine == "on":
                  - string: {text: "󰅶 ", foreground: 00ff00ff}
                caffeine == "off":
                  - string: {text: "󰅶 "}
          - string: {text: " | "}

    - clock:
        date-format: "%a, %Y-%m-%d"
        # time-format: "%H:%M"
        time-format: "%H:%M:%S"
        content:
          - list:
              on-click: orage --toggle
              items:
                - string: {text: " 󰔠 {date} {time} "}
